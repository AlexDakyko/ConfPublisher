# === СЕРВЕР ===
server:
  # По умолчанию 9090; при запуске ты переопределяешь --server.port=9091 — это нормально
  port: ${SERVER_PORT:9090}
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: always

logging:
  level:
    root: INFO
    com.confpub: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
    org.springframework.web.servlet.handler.HandlerExceptionResolverComposite: DEBUG


# === SPRING / ДАТАБАЗА / WEB ===
spring:
  datasource:
    # URL, пользователь и пароль — оставляем как в проекте
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/confpublisher}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    open-in-view: false
    # ВАЖНО: все Hibernate-настройки — только через 'spring.jpa.properties'
    properties:
      # Чтобы Hibernate не лез в LOB-контекст при работе с TEXT
      hibernate.jdbc.lob.non_contextual_creation: true
      # Диалект указывать не нужно — Hibernate сам подберёт и сам же писал варнинг убрать это.
      # Если очень хочется принудительно — добавь строку ниже:
      # hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  mvc:
    # CORS для фронта
    cors:
      mappings:
        "/**":
          allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
          allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
          allowed-headers: "*"
          allow-credentials: true
          max-age: 3600
